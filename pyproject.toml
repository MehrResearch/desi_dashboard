[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desi-dashboard"
version = "0.1.0"
description = "Interactive marimo dashboard for Waters DESI-MS imaging data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mehr Research" }]
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "marimo>=0.23.14",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/desi_dashboard"]

[tool.hatch.build.targets.sdist]
include = [
    "src/desi_dashboard",
    "README.md",
    "LICENSE",
]
